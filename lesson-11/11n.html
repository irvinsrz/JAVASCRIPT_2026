<!DOCTYPE html>
<html>
  
  <head>
    <title>Todo List</title>
  </head>


  <body>
    
    <script> 
      function countWords(words) {
        const result = {
          apple: [0],
          grape: [0]
        };

        for (let i = 0; i < words.length; i++){
          const value = words[i];

          if (value === 'apple'){
            result.apple++
          }

          if (value === 'grape'){
            result.grape++
          }
        }
        return result;
      }

      console.log(countWords(['apple', 'grape', 'apple', 'apple']))
    </script>
  </body>
</html>
