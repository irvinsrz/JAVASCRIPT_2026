<!DOCTYPE html>
<html>
  
  <head>
    <title></title>
    
  </head>


  <body>
    <input placeholder="Name" class="js-input-name">

    <button onclick="
      displayName();
    ">Submit</button>

    <p class="displaying-name"></p>

    <script>
      function displayName(){
        const inputElement =  document.querySelector('.js-input-name')

        document.querySelector('.displaying-name').innerHTML = `Your name is ${inputElement.value}`;
      }

    </script>
  </body>
</html>
