<!DOCTYPE html>
<html>
  
  <head>
    <title></title>
    
  </head>


  <body>
    <input placeholder="Type something" class="js-input" onkeyup="typing()">
    <p class="js-message"></p>

    <script>
      function typing(){
        const inputElement = document.querySelector('.js-input')
        document.querySelector('.js-message').innerHTML = inputElement.value;
      }

    </script>
  </body>
</html>
