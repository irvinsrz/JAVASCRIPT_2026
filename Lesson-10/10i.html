<!DOCTYPE html>
<html>
  <title>Calculator</title>
  <head>
    <style>
      body{
        font-family: Arial;
        background-color: rgb(0, 0, 0);
      }
      .yellow-button{
        background-color: rgb(254, 160, 10);
        color: white;
      }
      .gray-button{
        background-color: rgb(51, 51, 51);
        color: white;
      }
      .calculator-button{
        border: none;
        color: white;
        border-radius: 50px;
        width: 60px;
        height: 60px;
        font-size: 26px;
        cursor: pointer;
        margin-right: 5px;
      }
      .clear-button{
        font-size: 17px;
      }
      .calculation{
        color: white;
        font-size: 45px;
        margin-top: 15px;
        margin-bottom: 5px;
      }
    </style>

  </head>

  <body>
    <p class="js-display calculation"></p>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(1);
      ">1</button>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(2);
      ">2</button>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(3);
      ">3</button>

    <button class="yellow-button calculator-button" onclick="
      updateCalculation('+');
      ">+</button>       

    </p>

    <p>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(4);
      ">4</button>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(5);
      ">5</button>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(6);
      ">6</button>

    <button class="yellow-button calculator-button" onclick="
      updateCalculation('-');
      ">-</button>      
    
    </p>
    
    <p>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(7);
      ">7</button>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(8);
      ">8</button>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(9);
      ">9</button>
    <button class="yellow-button calculator-button" onclick="
      updateCalculation('*');
      ">*</button>    
    </p>

    <button class="gray-button calculator-button" onclick="
     updateCalculation(0);
      ">0</button>    
    
    <button class="gray-button calculator-button" onclick="
      updateCalculation('.');
      ">.</button>    

    <button class="gray-button calculator-button" onclick="
      calculation = eval(calculation);
      console.log(calculation);
    ">=</button>  

    <button class="yellow-button calculator-button" onclick="
      updateCalculation('/');
      ">/</button>    

    

    <p>
      <button class="gray-button calculator-button clear-button" onclick="
        
        console.log(calculation);
        calculation = '';
        ">Clear</button>
    </p>  

    
  
    <script>

      let calculation = localStorage.getItem('saveCalculation') || '';

      function updateCalculation(value){  
        calculation += value;
        displayCalculation();
      }

      function saveCalculation(){
        localStorage.setItem('calculation',calculation);
      }

      function displayCalculation(){
        document.querySelector('.js-display').innerHTML = calculation;
      }
      
    </script>

  </body>
</html>
