<!DOCTYPE html>
<html>
  <title>Calculator</title>
  <head>
    <link rel="stylesheet" href="10j.css">

  </head>

  <body>
    <p class="js-display calculation"></p>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(1);
      ">1</button>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(2);
      ">2</button>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(3);
      ">3</button>

    <button class="yellow-button calculator-button" onclick="
      updateCalculation('+');
      ">+</button>       

    </p>

    <p>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(4);
      ">4</button>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(5);
      ">5</button>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(6);
      ">6</button>

    <button class="yellow-button calculator-button" onclick="
      updateCalculation('-');
      ">-</button>      
    
    </p>
    
    <p>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(7);
      ">7</button>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(8);
      ">8</button>

    <button class="gray-button calculator-button" onclick="
      updateCalculation(9);
      ">9</button>
    <button class="yellow-button calculator-button" onclick="
      updateCalculation('*');
      ">*</button>    
    </p>

    <button class="gray-button calculator-button" onclick="
     updateCalculation(0);
      ">0</button>    
    
    <button class="gray-button calculator-button" onclick="
      updateCalculation('.');
      ">.</button>    

    <button class="gray-button calculator-button" onclick="
      calculation = eval(calculation);
      console.log(calculation);
    ">=</button>  

    <button class="yellow-button calculator-button" onclick="
      updateCalculation('/');
      ">/</button>    

    

    <p>
      <button class="gray-button calculator-button clear-button" onclick="
        
        console.log(calculation);
        calculation = '';
        ">Clear</button>
    </p>  

    
  
    <script src="10j.js"> </script>

  </body>
</html>
