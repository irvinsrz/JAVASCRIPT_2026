<!DOCTYPE html>
<html>
  
  <head>
    <title>Function</title>
    
    <style>
      button{
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .is-toggled{
        background-color: black;
        color: white;
      }
    </style>
  </head>

  <body>
    <button class="js-gaming" onclick="gaming()">
      Gaming
    </button>
        
    <script>
      function gaming() {
        const button = document.querySelector('.js-gaming');
        if (!button.classList.contains('is-toggled')){
        button.classList.add('is-toggled');
        }else{
          button.classList.remove('is-toggled');
        }

      }

    </script>
  </body>
</html>
