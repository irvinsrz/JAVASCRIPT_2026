<!DOCTYPE html>
<html>
  
  <head>
    <title></title>
    
  </head>


  <body>
    <script>
     function coverLength(length, from, to) {
      if (from === 'km' && to === 'miles') {
          return `${length / 1.6} miles`;
      }else if (from === 'miles' && to === 'km'){
        return `${length * 1.6} km`;
      }else if (from === 'km' && to === 'km'){
        return `${length * 1.6} km`;
      }else if (from === 'miles' && to === 'ft'){
        return `${length * 5280} ft`;
      }else if (from === 'km' && to === 'ft'){
        return `${length * 3281} ft`;
      }
     }

     console.log(coverLength(5,'miles','km'))
     console.log(coverLength(5,'miles','ft'))
     console.log(coverLength(5,'miles','ft'))
    
    </script>
  </body>
</html>
