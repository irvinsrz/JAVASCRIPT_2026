<!DOCTYPE html>
<html>
  
  <head>
    <title></title>
    
  </head>


  <body>
    

    <script>

      const coffee = 5;
      const bagels = 6;
      const soup = 9;
      const cost = coffee + bagels + soup;
      console.log(`Cost of Food: ${cost}`);

      const tax = cost * 0.1;
      console.log(`Tax (10%): ${tax}`);

      totalCost = cost + tax;
      console.log(`Total cost: ${totalCost}`);
      
    </script>
  </body>
</html>
