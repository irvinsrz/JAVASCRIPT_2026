<!DOCTYPE html>
<html>
  <title>Buttons</title>
  <head>
    <style>
      .add{
        background-color: yellow;
        color: black;
      }

      .buy{
        background-color: orange;
      }
    </style>
  </head>

  <body>
    <p>
      Adults Plain Cotton T-shirt
    </p>

    <p>
      Price: $7.99
    </p>

    <button class="add" onclick="
    alert('Added')">
      Add to cart
    </button>

    <button class="buy" onclick="
    console.log('Loading...');
    alert('Purchased')
    ">Buy now
    </button>

  </body>
</html>
